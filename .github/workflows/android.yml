# Сборка приложения-виджета «Календарь ателье» для Android (папка android-widget).
# Готовый файл .apk выкладывается в раздел Releases под меткой android-widget — ссылка на скачивание
# есть на странице widget-phone.html. Если сборка не прошла — там же выкладывается журнал ошибок.
name: Android-виджет

on:
  push:
    branches: [main]
    paths: ['android-widget/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-widget
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Сборка APK
        run: gradle -p android-widget assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Выложить APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-widget/app/build/outputs/apk/debug/app-debug.apk calendar-atelier.apk
          gh release delete android-widget --yes --cleanup-tag || true
          gh release create android-widget calendar-atelier.apk \
            --title "Календарь ателье для Android" \
            --notes "Виджет «Календарь ателье» для Android. Установка — страница widget-phone.html на сайте программы. Сборка ${{ github.sha }}." \
            --latest=false

      - name: Журнал ошибок сборки
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 60000 build.log > android-build-log.txt || echo "нет журнала" > android-build-log.txt
          gh release delete android-widget-log --yes --cleanup-tag || true
          gh release create android-widget-log android-build-log.txt --title "Ошибка сборки Android-виджета" --notes "Журнал последней неудачной сборки" --latest=false --prerelease
